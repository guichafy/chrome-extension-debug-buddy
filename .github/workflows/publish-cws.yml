name: Publish to Chrome Web Store

on:
  # Dispara automaticamente quando o workflow Release publica uma nova
  # GitHub Release (semantic-release cria a tag vX.Y.Z e a Release).
  # Pre-releases são ignoradas (a CWS não aceita versões com sufixo
  # como 1.0.0-rc.1 e o validate-extension.mjs rejeitaria o upload).
  # O upload sai como rascunho — submissão para revisão é manual no
  # Chrome Web Store Developer Dashboard.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Auto-publish to all users (uncheck for upload-only draft)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # workflow_dispatch sempre roda; release events só rodam para versões estáveis.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease != true
    environment: ChromeStore
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint extension shape
        run: npm run lint:ext
      - name: Publish
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "true" ]; then
            npm run publish:cws -- --publish
          else
            npm run publish:cws
          fi
      - name: Abrir issue se o upload falhar (somente em release events)
        if: failure() && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "CWS publish falhou para ${TAG}" \
            --body "O workflow *Publish to Chrome Web Store* falhou para a release [\`${TAG}\`](${RUN_URL}). A GitHub Release foi criada mas a extensão NÃO foi enviada ao Chrome Web Store. Investigue os logs do run e re-execute manualmente via Actions → Publish to Chrome Web Store → Run workflow."
