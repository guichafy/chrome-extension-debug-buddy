name: Publish to Chrome Web Store

# Re-publish manual da extensão. O publish automático em cada release
# acontece dentro de `release.yml` (chained após semantic-release) — esse
# desenho contorna a regra do GitHub que impede `release.published` de
# disparar workflows quando a release foi criada com o GITHUB_TOKEN.
#
# Use este workflow para:
#   - Retry quando o step de publish do release.yml falhou.
#   - Ramp-up: subir o rascunho que já está na CWS para "publicar a todos".
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Auto-publish to all users (uncheck for upload-only draft)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ChromeStore
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint extension shape
        run: npm run lint:ext
      - name: Publish
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.publish }}" = "true" ]; then
            npm run publish:cws -- --publish
          else
            npm run publish:cws
          fi
