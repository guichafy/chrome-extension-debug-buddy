name: Release

on:
  push:
    branches: [main]
  # Allow maintainers to trigger a release run manually from the Actions tab.
  # Useful when GitHub silently skipped a push event (e.g. when this workflow
  # file was first added) or to force semantic-release to re-evaluate.
  workflow_dispatch:

# Skip the release run if the push was made by semantic-release itself
# (defense in depth on top of the [skip ci] token in its commit message).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    environment: ChromeStore
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (so semantic-release runs against a known-good tree)
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Run E2E (gera evidência para a release)
        run: xvfb-run --auto-servernum npx playwright test
        env:
          CI: '1'

      - name: Lint extension shape
        run: npm run lint:ext
      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # Disable husky's commit-msg hook for the bot's release commit.
          # commitlint rejects semantic-release's auto-generated message when
          # it includes the changelog notes (long markdown URLs exceed the
          # 100-char footer limit). We trim the commit body via .releaserc
          # message config; HUSKY=0 is defense in depth.
          HUSKY: '0'
        run: npx semantic-release

      # Republica o build após o semantic-release atualizar manifest.json
      # para que o ZIP enviado à CWS contenha exatamente a versão recém-cortada.
      - name: Rebuild com a nova versão
        if: steps.release.outputs.new_version_published == 'true'
        run: npm run build

      - name: Publish to Chrome Web Store (rascunho)
        if: steps.release.outputs.new_version_published == 'true' && steps.release.outputs.release_channel == 'stable'
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npm run publish:cws

      - name: Abrir issue se o upload na CWS falhar
        if: failure() && steps.release.outputs.new_version_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.release.outputs.new_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "CWS publish falhou para ${TAG}" \
            --body "O step *Publish to Chrome Web Store* falhou para a release [\`${TAG}\`](${RUN_URL}). A GitHub Release foi criada mas a extensão NÃO foi enviada ao Chrome Web Store. Investigue os logs do run e re-execute manualmente via Actions → Publish to Chrome Web Store → Run workflow."
