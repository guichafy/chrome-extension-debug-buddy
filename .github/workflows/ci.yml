name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (Biome)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Lint extension shape
        run: npm run lint:ext
      - name: Test (Vitest)
        run: npm test
