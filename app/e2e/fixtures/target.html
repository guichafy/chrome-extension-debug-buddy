<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="utf-8" />
		<title>E2E Target</title>
	</head>
	<body>
		<h1>Página alvo E2E</h1>
		<pre id="users-data">loading...</pre>
		<script>
			fetch("/api/users")
				.then((r) => r.json())
				.then((data) => {
					document.getElementById("users-data").textContent = JSON.stringify(data);
				})
				.catch((err) => {
					document.getElementById("users-data").textContent = "ERROR: " + err.message;
				});

			// Helper exposto para os specs Phase 8 dispararem fetches sob demanda
			// e ler o resultado completo (status, body, ok, error) via evaluate.
			window.runFetch = async function (url, opts) {
				try {
					const resp = await fetch(url, opts);
					let body = null;
					try {
						body = await resp.text();
					} catch {
						body = null;
					}
					return { ok: resp.ok, status: resp.status, body };
				} catch (err) {
					return { ok: false, status: 0, body: null, error: String(err && err.message) };
				}
			};
		</script>
	</body>
</html>
