<!DOCTYPE html>
<html>
<head>
  <title>Network Request Interceptor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Network Request Interceptor</h1>
    
    <div class="tabs">
      <button class="tab-button active" data-tab="settings">Settings</button>
      <button class="tab-button" data-tab="responses">Pending Responses</button>
    </div>
    
    <div id="settings" class="tab-content active">
      <div class="input-group">
        <input type="text" id="urlPattern" placeholder="Enter URL pattern to intercept (e.g., example.com)">
        <button id="addUrl">Add URL</button>
      </div>
      
      <div class="url-list-container">
        <h2>URLs to intercept:</h2>
        <ul id="urlList"></ul>
      </div>
      
      <div class="controls">
        <button id="startDebugging">Start Debugging</button>
        <button id="stopDebugging">Stop Debugging</button>
      </div>
      
      <div class="status-container">
        <p>Status: <span id="status">Not debugging</span></p>
      </div>
    </div>
    
    <div id="responses" class="tab-content">
      <div class="pending-responses-container">
        <h2>Pending Responses</h2>
        <div id="pendingResponsesList" class="pending-responses-list">
          <p class="no-responses">No pending responses</p>
        </div>
      </div>
      
      <div id="responseDetails" class="response-details hidden">
        <h2>Response Details</h2>
        <div class="response-info">
          <p><strong>URL:</strong> <span id="responseUrl"></span></p>
          <p><strong>Type:</strong> <span id="responseType"></span></p>
          <p><strong>MIME Type:</strong> <span id="responseMimeType"></span></p>
        </div>
        
        <div class="response-edit-container">
          <div class="response-edit-group">
            <label for="responseStatus">Status Code:</label>
            <input type="number" id="responseStatus" min="100" max="599">
          </div>
          
          <div class="response-edit-group">
            <label for="responseHeaders">Headers:</label>
            <textarea id="responseHeaders" rows="5"></textarea>
          </div>
          
          <div class="response-edit-group">
            <label for="responseBody">Body:</label>
            <textarea id="responseBody" rows="10"></textarea>
          </div>
          
          <div class="response-actions">
            <button id="approveResponse" class="approve-button">Approve Response</button>
            <button id="cancelEdit" class="cancel-button">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
