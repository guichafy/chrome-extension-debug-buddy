<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Request Interceptor</title>
  <link rel="icon" href="images/icon48.png" type="image/png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="styles.css">
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="lib/codemirror/codemirror.min.css">
  <link rel="stylesheet" href="lib/codemirror/theme/dracula.min.css">
  <link rel="stylesheet" href="lib/codemirror/addon/fold/foldgutter.min.css">
  <link rel="stylesheet" href="lib/codemirror/addon/lint/lint.min.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-container">
        <img src="images/icon48.png" alt="Logo" class="logo">
        <h1>Network Request Interceptor</h1>
      </div>
      <div class="header-controls">
        <button id="selectTargetTab" class="primary-button">
          <span class="material-icons">tab</span>
          Selecionar Aba
        </button>
        <button id="startDebugging" class="primary-button">
          <span class="material-icons">play_arrow</span>
          Iniciar Interceptação
        </button>
        <button id="stopDebugging" class="danger-button">
          <span class="material-icons">stop</span>
          Parar Interceptação
        </button>
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span id="status">Inativo</span>
        </div>
      </div>
    </header>

    <div class="main-content">
      <div class="sidebar">
        <nav class="nav-menu">
          <button class="nav-item active" data-tab="settings">
            <span class="material-icons">settings</span>
            <span>Configurações</span>
          </button>
          <button class="nav-item" data-tab="responses">
            <span class="material-icons">list</span>
            <span>Requisições</span>
            <span class="badge" id="requestCount">0</span>
          </button>
          <button class="nav-item" data-tab="mockConfig">
            <span class="material-icons">build</span>
            <span>Mocks</span>
          </button>
        </nav>
      </div>

      <div class="content-area">
        <div id="settings" class="tab-content active">
          <div class="panel">
            <h2>Configurar interceptação</h2>
            <div class="input-group">
              <div class="input-row">
                <div class="field">
                  <label for="urlPattern">Padrão de URL</label>
                  <input type="text" id="urlPattern" placeholder="Exemplo: api.exemplo.com/endpoint">
                </div>
              </div>
              <div class="input-row">
                <div class="field">
                  <label for="httpMethod">Método HTTP</label>
                  <select id="httpMethod">
                    <option value="ANY">Qualquer método</option>
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                    <option value="PATCH">PATCH</option>
                    <option value="HEAD">HEAD</option>
                    <option value="OPTIONS">OPTIONS</option>
                  </select>
                </div>
                <div class="field">
                  <label for="headerType">Tipo de Header</label>
                  <select id="headerType">
                    <option value="request">Request</option>
                    <option value="response">Response</option>
                  </select>
                </div>
              </div>
              <div class="input-row">
                <div class="field">
                  <label for="requestHeaderName">Nome do Header</label>
                  <input type="text" id="requestHeaderName" placeholder="Content-Type">
                </div>
                <div class="field">
                  <label for="requestHeaderValue">Valor do Header</label>
                  <input type="text" id="requestHeaderValue" placeholder="application/json">
                </div>
              </div>
              <button id="addUrl" class="primary-button">
                <span class="material-icons">add</span>
                Adicionar URL
              </button>
            </div>
          </div>

          <div class="panel">
            <h2>URLs configuradas</h2>
            <div class="url-list-container">
              <ul id="urlList"></ul>
            </div>
          </div>
        </div>

        <div id="responses" class="tab-content">
          <div class="panel">
            <h2>Requisições interceptadas</h2>
            <div class="pending-responses-container">
              <div id="pendingResponsesList" class="pending-responses-list">
                <p class="no-responses">Nenhuma requisição interceptada</p>
              </div>
            </div>
          </div>

          <div id="responseDetails" class="panel response-details hidden">
            <h2>Detalhes da Resposta</h2>
            <div class="response-info">
              <div class="response-header">
                <div>
                  <p><strong>URL:</strong> <span id="responseUrl"></span></p>
                  <p><strong>Tipo:</strong> <span id="responseType"></span></p>
                  <p><strong>MIME Type:</strong> <span id="responseMimeType"></span></p>
                </div>
                <div class="response-actions">
                  <button id="mockResponse" class="secondary-button">
                    <span class="material-icons">build</span>
                    Mock
                  </button>
                  <button id="ignoreResponse" class="secondary-button">
                    <span class="material-icons">play_arrow</span>
                    Ignorar
                  </button>
                  <button id="editResponse" class="secondary-button">
                    <span class="material-icons">edit</span>
                    Editar
                  </button>
                </div>
              </div>
            </div>

            <div class="response-edit-container">
              <div class="response-edit-group">
                <label for="responseStatus">Status Code:</label>
                <input type="number" id="responseStatus" min="100" max="599">
              </div>

              <div class="response-edit-group">
                <label for="responseHeaders">Headers:</label>
                <textarea id="responseHeaders" rows="5"></textarea>
              </div>

              <div class="response-edit-group">
                <label for="responseBody">Body:</label>
                <textarea id="responseBody" rows="10"></textarea>
              </div>

              <div class="response-actions">
                <button id="approveResponse" class="primary-button">
                  <span class="material-icons">check</span>
                  Aplicar Alterações
                </button>
                <button id="cancelEdit" class="secondary-button">
                  <span class="material-icons">close</span>
                  Cancelar
                </button>
              </div>
            </div>
          </div>
        </div>

        <div id="mockConfig" class="tab-content">
          <div class="panel">
            <h2>Configuração de Mocks</h2>
            <div class="mock-list-container">
              <div id="mockList" class="mock-list">
                <p class="no-mocks">Nenhum mock configurado</p>
              </div>
            </div>
            <button id="addMock" class="primary-button">
              <span class="material-icons">add</span>
              Adicionar Mock
            </button>
          </div>

          <div id="mockDetails" class="panel mock-details hidden">
            <h2>Configuração de Mock</h2>
            <div class="input-group">
              <div class="input-row">
                <div class="field">
                  <label for="mockUrlPattern">Padrão de URL</label>
                  <input type="text" id="mockUrlPattern" placeholder="Exemplo: api.exemplo.com/endpoint">
                </div>
              </div>
              <div class="input-row">
                <div class="field">
                  <label for="mockMethod">Método HTTP</label>
                  <select id="mockMethod">
                    <option value="ANY">Qualquer método</option>
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                    <option value="PATCH">PATCH</option>
                  </select>
                </div>
                <div class="field">
                  <label for="mockStatus">Status Code</label>
                  <input type="number" id="mockStatus" min="100" max="599" value="200">
                </div>
              </div>
              <div class="input-row">
                <div class="field full-width">
                  <div class="editor-header">
                    <label for="mockHeaders">Headers (JSON)</label>
                    <div class="editor-actions">
                      <button type="button" id="formatHeadersBtn" class="editor-action-btn" title="Formatar JSON">
                        <span class="material-icons">format_align_left</span>
                      </button>
                    </div>
                  </div>
                  <div id="mockHeadersEditor" class="code-editor-container"></div>
                  <textarea id="mockHeaders" rows="3" placeholder='{"Content-Type": "application/json"}' style="display: none;"></textarea>
                </div>
              </div>
              <div class="input-row">
                <div class="field full-width">
                  <div class="editor-header">
                    <label for="mockBody">Body</label>
                    <div class="editor-actions">
                      <button type="button" id="detectBodyTypeBtn" class="editor-action-btn" title="Detectar tipo de conteúdo">
                        <span class="material-icons">auto_fix_high</span>
                      </button>
                      <button type="button" id="formatBodyBtn" class="editor-action-btn" title="Formatar conteúdo">
                        <span class="material-icons">format_align_left</span>
                      </button>
                      <select id="bodyContentType" class="content-type-select">
                        <option value="json">JSON</option>
                        <option value="html">HTML</option>
                        <option value="text">Texto</option>
                      </select>
                    </div>
                  </div>
                  <div id="mockBodyEditor" class="code-editor-container"></div>
                  <textarea id="mockBody" rows="8" placeholder='{"data": "Conteúdo de exemplo"}' style="display: none;"></textarea>
                </div>
              </div>
              <div class="button-row">
                <button id="saveMock" class="primary-button">
                  <span class="material-icons">save</span>
                  Salvar Mock
                </button>
                <button id="cancelMock" class="secondary-button">
                  <span class="material-icons">close</span>
                  Cancelar
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- CodeMirror Scripts -->
  <script src="lib/codemirror/codemirror.min.js"></script>
  <script src="lib/codemirror/mode/javascript/javascript.min.js"></script>
  <script src="lib/codemirror/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="lib/codemirror/mode/xml/xml.min.js"></script>
  <script src="lib/codemirror/mode/css/css.min.js"></script>
  <script src="lib/codemirror/addon/edit/matchbrackets.min.js"></script>
  <script src="lib/codemirror/addon/edit/closebrackets.min.js"></script>
  <script src="lib/codemirror/addon/fold/foldcode.min.js"></script>
  <script src="lib/codemirror/addon/fold/foldgutter.min.js"></script>
  <script src="lib/codemirror/addon/fold/brace-fold.min.js"></script>
  <script src="lib/codemirror/addon/lint/lint.min.js"></script>
  <script src="lib/codemirror/addon/lint/json-lint.min.js"></script>
  <script src="lib/jsonlint.min.js"></script>
  <script src="lib/prettier/standalone.min.js"></script>
  <script src="lib/prettier/parser-html.min.js"></script>
  <script src="lib/prettier/parser-babel.min.js"></script>

  <script src="main.js"></script>
</body>
</html>
